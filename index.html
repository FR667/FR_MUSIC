<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">FR MUSIC - 專業頂級音樂平台</title>
    <style>
        :root {
            --bg-color: #050505;
            --surface-color: #121212;
            --surface-hover: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #a7a7a7;
            --accent: #fa243c;
            --border-color: #282828;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 110px;
            transition: background-color 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 頂部導覽列 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo img {
            width: 36px;
            height: 36px;
            object-fit: cover;
            border-radius: 50%;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .logo img.rotate-animate {
            transform: rotate(-360deg) scale(1.1);
        }

        .search-container {
            position: relative;
            width: 380px;
        }

        .search-bar {
            width: 100%;
            padding: 11px 16px 11px 42px;
            border-radius: 500px;
            border: 1px solid transparent;
            background-color: #242424;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .search-bar:focus {
            border-color: var(--accent);
            background-color: #121212;
            box-shadow: 0 0 15px rgba(250, 36, 60, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            width: 16px;
            height: 16px;
        }

        .search-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            width: 100%;
            background: #181818;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.6);
            display: none;
            z-index: 200;
            padding: 10px 0;
        }

        .search-dropdown.show { display: block; }
        .dropdown-title { padding: 6px 16px; font-size: 12px; color: var(--text-secondary); font-weight: 600; }
        .tag-item { padding: 10px 16px; font-size: 14px; color: var(--text-primary); cursor: pointer; transition: background 0.2s; }
        .tag-item:hover { background: var(--surface-hover); }

        .settings-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            transition: all 0.2s;
        }
        .settings-btn:hover { color: var(--text-primary); background: var(--surface-hover); transform: rotate(45deg); }

        /* 主要內容區 */
        main {
            flex: 1;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .hero-banner {
            background: linear-gradient(135deg, #2b0c11 0%, #120507 100%);
            border-radius: 24px;
            padding: 40px 50px;
            margin-bottom: 40px;
            border: 1px solid rgba(250, 36, 60, 0.2);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            gap: 35px;
            position: relative;
            overflow: hidden;
        }

        .hero-banner::after {
            content: '';
            position: absolute;
            top: -60px;
            right: -60px;
            width: 280px;
            height: 280px;
            background: var(--accent);
            opacity: 0.12;
            border-radius: 50%;
            filter: blur(70px);
            pointer-events: none;
        }

        .hero-cover {
            width: 170px;
            height: 170px;
            border-radius: 16px;
            object-fit: cover;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            flex-shrink: 0;
        }

        .hero-content { flex: 1; }

        .hero-tag {
            font-size: 12px;
            color: var(--accent);
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hero-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .hero-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .hero-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 11px 26px;
            border-radius: 500px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 20px rgba(250, 36, 60, 0.4);
        }

        .hero-btn:hover { transform: scale(1.05); filter: brightness(1.1); }

        section h3 {
            font-size: 22px;
            margin-bottom: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        /* 精選推薦網格 */
        .grid-section {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 24px;
            margin-bottom: 45px;
        }

        .album-card {
            background-color: var(--surface-color);
            padding: 16px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid transparent;
        }

        .album-card:hover {
            background-color: var(--surface-hover);
            transform: translateY(-6px);
            border-color: var(--border-color);
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
        }

        .album-card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 14px;
        }

        .album-card .title { font-size: 15px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .album-card .desc { font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* 全部歌曲清單 */
        .song-list { display: flex; flex-direction: column; gap: 10px; }
        .song-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background-color: var(--surface-color);
            border-radius: 12px;
            border: 1px solid transparent;
            transition: all 0.25s;
        }
        .song-item:hover { background-color: var(--surface-hover); border-color: var(--border-color); }
        .song-info { display: flex; align-items: center; gap: 16px; flex: 1; cursor: pointer; }
        .song-thumb { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; }
        .song-title { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
        .song-artist { font-size: 13px; color: var(--text-secondary); }

        .action-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 7px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .action-btn:hover { border-color: var(--text-primary); background: var(--text-primary); color: var(--bg-color); }

        /* 底部常駐播放器 */
        .bottom-player {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 96px;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            z-index: 90;
        }

        .player-left { display: flex; align-items: center; gap: 16px; width: 300px; cursor: pointer; }
        .player-left img { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; }
        .player-meta .title { font-size: 14px; font-weight: 600; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 210px; }
        .player-meta .status { font-size: 12px; color: var(--text-secondary); }

        .player-center { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; max-width: 600px; }
        .player-controls { display: flex; align-items: center; gap: 20px; }
        .ctrl-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .ctrl-btn:hover { color: var(--text-primary); transform: scale(1.1); }
        .ctrl-btn.active { color: var(--accent); }

        .play-pause-btn {
            background: var(--text-primary);
            color: var(--bg-color);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .play-pause-btn:hover { transform: scale(1.1); }

        .progress-container { display: flex; align-items: center; gap: 12px; width: 100%; font-size: 11px; color: var(--text-secondary); }
        .progress-bar { flex: 1; height: 5px; background: #4d4d4d; border-radius: 3px; position: relative; cursor: pointer; }
        .progress-filled { position: absolute; top: 0; left: 0; height: 100%; background: var(--text-primary); border-radius: 3px; width: 0%; }
        .progress-bar:hover .progress-filled { background: var(--accent); }

        .player-right { width: 300px; display: flex; justify-content: flex-end; align-items: center; gap: 12px; }
        .volume-slider { width: 100px; accent-color: var(--text-primary); cursor: pointer; }

        /* 全螢幕播放 Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }

        .modal-blur-bg {
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            background-size: cover;
            background-position: center;
            filter: blur(55px) brightness(0.4);
            transform: scale(1.1);
            z-index: 1;
            transition: background-image 0.6s ease;
        }

        .modal-overlay::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 2;
            pointer-events: none;
        }

        .carplay-container {
            width: 90%;
            max-width: 900px;
            background: rgba(18, 18, 22, 0.65);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 32px;
            display: flex;
            align-items: center;
            gap: 50px;
            padding: 50px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            position: relative;
            z-index: 10;
            transform: scale(0.95) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-overlay.open .carplay-container {
            transform: scale(1) translateY(0);
        }

        .close-modal-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            z-index: 20;
            transition: all 0.2s;
        }
        .close-modal-btn:hover { background: rgba(255,255,255,0.25); color: var(--text-primary); }

        .carplay-left {
            position: relative;
            width: 320px;
            height: 320px;
            flex-shrink: 0;
        }

        .carplay-cover {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            object-fit: cover;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
        }

        /* 升級版流暢等化器動畫 */
        .visualizer-bars {
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: flex-end;
            gap: 5px;
            height: 35px;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.35);
            padding: 4px 10px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .v-bar {
            width: 4px;
            background: var(--accent);
            border-radius: 3px;
            height: 6px;
            transition: height 0.2s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 0 8px var(--accent);
        }

        .carplay-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .carplay-song-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            color: #ffffff;
            line-height: 1.2;
        }

        .carplay-song-artist {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 35px;
        }

        .carplay-controls-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        .carplay-controls {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        #audio-player { display: none; }

        @media(max-width: 768px) {
            header { padding: 15px 20px; }
            .search-container { width: 200px; }
            main { padding: 20px; }
            .hero-banner { flex-direction: column; text-align: center; padding: 25px; gap: 20px; }
            .hero-cover { width: 130px; height: 130px; }
            .hero-tag { justify-content: center; }
            .carplay-container {
                flex-direction: column;
                width: 92%;
                padding: 30px 20px;
                gap: 25px;
                max-height: 90vh;
                overflow-y: auto;
            }
            .carplay-left { width: 200px; height: 200px; }
            .carplay-song-title { font-size: 22px; text-align: center; }
            .carplay-song-artist { font-size: 14px; text-align: center; margin-bottom: 20px; }
            .carplay-right { width: 100%; align-items: center; }
            .carplay-controls { justify-content: center; gap: 16px; }
            .player-right { display: none; }
            .player-left { width: 220px; }
        }
    </style>
</head>
<body>

    <!-- 頂部導覽列 -->
    <header>
        <div class="logo" id="brand-title" onclick="onLogoClick()">
            <img src="https://i.ibb.co/m54LF470/Background-Eraser-20260816-214356376.png" id="logo-img" alt="Logo">
            <span id="nav-brand-text">FR MUSIC</span>
        </div>
        
        <div class="search-container">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search-input" class="search-bar" placeholder="搜尋歌曲、曲風..." onfocus="showHotSearch()" onblur="hideHotSearch()" oninput="filterSongs(this.value)">
            
            <div class="search-dropdown" id="search-dropdown">
                <div class="dropdown-title" id="dd-title">熱門曲風標籤</div>
                <div class="tag-item" onclick="selectTag('電子賽博')">⚡ 電子賽博</div>
                <div class="tag-item" onclick="selectTag('電子音樂')">🎧 電子音樂</div>
                <div class="tag-item" onclick="selectTag('獨家釋出')">🔥 獨家釋出</div>
                <div class="tag-item" onclick="resetSearchFilter()" id="dd-clear" style="color:var(--accent);">清除篩選條件</div>
            </div>
        </div>

        <button class="settings-btn" onclick="openSettings()" title="網站設定">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
    </header>

    <!-- 主要內容區 -->
    <main>
        <div class="hero-banner" id="hero-banner-box">
            <img class="hero-cover" id="hero-cover" src="" alt="封面">
            <div class="hero-content">
                <div class="hero-tag" id="hero-tag-text">🔥 用戶喜愛的音樂焦點單曲</div>
                <div class="hero-title" id="hero-title">載入中...</div>
                <div class="hero-desc" id="hero-desc">享受無損純淨音質與沉浸式互動介面，點擊下方按鈕立即啟動全新賽博風音樂饗宴。</div>
                <button class="hero-btn" onclick="openModal(); playSong(heroSongIndex);">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <span id="btn-play-now">立即播放</span>
                </button>
            </div>
        </div>

        <section style="margin-bottom: 40px;">
            <h3 id="section-featured">精選推薦</h3>
            <div class="grid-section" id="grid-section-container"></div>
        </section>

        <section>
            <h3 id="section-all-songs">全部歌曲清單</h3>
            <div class="song-list" id="song-list-container"></div>
        </section>
    </main>

    <!-- 底部常駐播放器 -->
    <div class="bottom-player">
        <div class="player-left" onclick="openModal()" title="展開全螢幕播放">
            <img id="player-thumb" src="" alt="封面">
            <div class="player-meta">
                <div class="title" id="player-title">尚未選擇歌曲</div>
                <div class="status" id="player-status">準備就緒</div>
            </div>
        </div>

        <div class="player-center">
            <div class="player-controls">
                <button class="ctrl-btn shuffle-trigger" onclick="toggleShuffle()" title="隨機播放">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
                </button>
                <button class="ctrl-btn" onclick="prevSong()" title="上一首">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button class="ctrl-btn" onclick="skipTime(-10)" title="快退 10 秒">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11.99 5V1L6 7l5.99 6v-4c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6h-2c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/><text x="8.5" y="15.5" font-size="7" fill="currentColor" stroke="none">10</text></svg>
                </button>
                <button class="play-pause-btn" onclick="togglePlayPause()">
                    <svg id="play-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="ctrl-btn" onclick="skipTime(10)" title="快轉 10 秒">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5V1l5.99 6L12 13v-4c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/><text x="8.5" y="15.5" font-size="7" fill="currentColor" stroke="none">10</text></svg>
                </button>
                <button class="ctrl-btn" onclick="nextSong()" title="下一首">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM5 18l8.5-6L5 6v12z"/></svg>
                </button>

            <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.01" value="1" oninput="setVolume(this.value)">

    <div class="modal-overlay" id="now-playing-modal">

    <!-- 設定視窗 Modal -->
    <div class="modal-overlay" id="settings-modal" style="background: rgba(0,0,0,0.8); backdrop-filter: blur(20px);">
        <div class="carplay-container" style="max-width: 420px; display: block; text-align: left;">
            <button class="close-modal-btn" onclick="closeSettings()">×</button>
            <h3 id="settings-title" style="margin-bottom: 20px;">網站設定</h3>
            
            <div style="margin-bottom: 15px;">
                <label id="lbl-language" style="display:block; font-size:14px; margin-bottom:5px; color:var(--text-secondary);">語言 (Language)</label>
                <select id="setting-language" style="width:100%; padding:10px; background:#222; border:1px solid var(--border-color); color:#fff; border-radius:8px; outline:none;">

                    <option value="#0f172a">2. 深邃夜空藍</option>
                    <option value="#180f2a">3. 神祕暗夜紫</option>
                    <option value="#1a0505">4. 暗紅賽博風</option>
                    <option value="#051a14">5. 森林極光綠</option>
                    <option value="#1c1917">6. 溫暖木質灰</option>
                    <option value="#221100">7. 琥珀黃金夜</option>
                    <option value="#001524">8. 深海深藍</option>
                    <option value="#1b1224">9. 迷幻紫羅蘭</option>
                    <option value="#0d1b1e">10. 冰川極地青</option>
                    <option value="#240e15">11. 暮光玫瑰紅</option>

                <button id="btn-save" onclick="saveSettings()" style="padding:9px 18px; background:var(--accent); border:none; color:#fff; border-radius:8px; cursor:pointer;">儲存設定</button>

    <audio id="audio-player"></audio>

    <script>
        let playlist = [];
        let playCounts = JSON.parse(localStorage.getItem('fr_play_counts')) || {};
        let currentIndex = 0;
        let heroSongIndex = 0;
        let isPlaying = false;
        let isShuffle = false;
        let isRepeat = false;

        const JSON_URL = "https://raw.githubusercontent.com/FR667/FR_MUSIC/refs/heads/main/data.json";

        // 多語系字典
        const translations = {
            'zh-TW': {
                pageTitle: "FR MUSIC - 專業頂級音樂平台",
                searchPlaceholder: "搜尋歌曲、曲風...",
                hotTitle: "熱門曲風標籤",
                clearFilter: "清除篩選條件",
                heroTag: "🔥 用戶喜愛的音樂焦點單曲",
                heroDesc: "享受無損純淨音質與沉浸式互動介面，點擊下方按鈕立即啟動全新賽博風音樂饗宴。",
                btnPlay: "立即播放",
                sectionFeatured: "精選推薦",
                sectionAllSongs: "全部歌曲清單",
                playerReady: "準備就緒",
                playerPlaying: "FR MUSIC 播放中",
                playerPaused: "已暫停",
                settingsTitle: "網站設定",
                lblLang: "語言 (Language)",
                lblBgTheme: "背景色系 (12種風格)",
                btnCancel: "取消",
                btnSave: "儲存設定",
                notFound: "找不到符合條件的歌曲",
                btnPlayList: "播放"
            },
            'en': {
                pageTitle: "FR MUSIC - Professional Music Platform",
                searchPlaceholder: "Search songs, genres...",
                hotTitle: "Popular Genres",
                clearFilter: "Clear Filter",
                heroTag: "🔥 Featured Spotlight Track",
                heroDesc: "Enjoy lossless audio quality and an immersive interactive interface. Click below to start your musical journey.",
                btnPlay: "Play Now",
                sectionFeatured: "Featured Recommendations",
                sectionAllSongs: "All Songs",
                playerReady: "Ready",
                playerPlaying: "Playing...",
                playerPaused: "Paused",
                settingsTitle: "Website Settings",
                lblLang: "Language",
                lblBgTheme: "Background Theme (12 Styles)",
                btnCancel: "Cancel",
                btnSave: "Save Settings",
                notFound: "No matching songs found",
                btnPlayList: "Play"
            },
            'ja': {
                pageTitle: "FR MUSIC - プロフェッショナル音楽プラットフォーム",
                searchPlaceholder: "曲名やジャンルを検索...",
                hotTitle: "人気のジャンル",
                clearFilter: "フィルターをクリア",
                heroTag: "🔥 おすすめの注目トラック",
                heroDesc: "ロスレスの純粋な音質と没入型インタラクティブインターフェースをお楽しみください。",
                btnPlay: "今すぐ再生",
                sectionFeatured: "おすすめの推薦",
                sectionAllSongs: "すべての楽曲",
                playerReady: "準備完了",
                playerPlaying: "再生中...",
                playerPaused: "一時停止中",
                settingsTitle: "サイト設定",
                lblLang: "言語 (Language)",
                lblBgTheme: "背景テーマ (12種類)",
                btnCancel: "キャンセル",
                btnSave: "保存",
                notFound: "一致する曲が見つかりませんでした",
                btnPlayList: "再生"
            },
            'ko': {
                pageTitle: "FR MUSIC - 전문 음악 플랫폼",
                searchPlaceholder: "노래, 장르 검색...",
                hotTitle: "인기 장르 태그",
                clearFilter: "필터 지우기",
                heroTag: "🔥 추천 스포트라이트 트랙",
                heroDesc: "손실 없는 순수한 음질과 몰입형 인터페이스를 즐겨보세요. 아래 버튼을 클릭하여 시작하세요.",
                btnPlay: "지금 재생",
                sectionFeatured: "추천 음원",
                sectionAllSongs: "모든 노래 목록",
                playerReady: "준비됨",
                playerPlaying: "재생 중...",
                playerPaused: "일시 정지",
                settingsTitle: "사이트 설정",
                lblLang: "언어 (Language)",
                lblBgTheme: "배경 테마 (12가지 스타일)",
                btnCancel: "취소",
                btnSave: "설정 저장",
                notFound: "일치하는 노래를 찾을 수 없습니다",
                btnPlayList: "재생"
            }
        };

        const audio = document.getElementById('audio-player');
        const playIcon = document.getElementById('play-icon');
        const modalPlayIcon = document.getElementById('modal-play-icon');
        const playerTitle = document.getElementById('player-title');
        const modalSongTitle = document.getElementById('modal-song-title');
        const modalSongArtist = document.getElementById('modal-song-artist');
        const playerStatus = document.getElementById('player-status');
        const playerThumb = document.getElementById('player-thumb');
        const modalCover = document.getElementById('modal-cover');
        const modalBlurBg = document.getElementById('modal-blur-bg');
        const progressFilled = document.getElementById('progress-filled');
        const modalProgressFilled = document.getElementById('modal-progress-filled');
        const currentTimeEl = document.getElementById('current-time');
        const durationTimeEl = document.getElementById('duration-time');
        const modalCurrentTimeEl = document.getElementById('modal-current-time');
        const modalDurationTimeEl = document.getElementById('modal-duration-time');

        const playSvg = '<path d="M8 5v14l11-7z"/>';
        const pauseSvg = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

        async function loadMusicData() {
            try {
                const response = await fetch(JSON_URL);
                playlist = await response.json();
                
                setupHeroSection();
                renderGrid(playlist);
                renderList(playlist);
                
                if (playlist.length > 0 && !audio.src) {
                    const song = playlist[0];
                    playerTitle.innerText = song.title;
                    modalSongTitle.innerText = song.title;
                    modalSongArtist.innerText = song.artist;
                    playerThumb.src = song.cover;
                    modalCover.src = song.cover;
                    modalBlurBg.style.backgroundImage = `url('${song.cover}')`;
                }
            } catch (error) {
                console.error('無法從 GitHub 載入音樂資料:', error);
            }
        }

        function loadUserSettings() {
            const saved = JSON.parse(localStorage.getItem('fr_music_settings')) || { language: 'zh-TW', bgTheme: '#050505' };
            
            // 套用背景色系
            document.documentElement.style.setProperty('--bg-color', saved.bgTheme);

            // 套用介面文字語系
            applyLanguage(saved.language);

            // 填入設定表單
            document.getElementById('setting-language').value = saved.language;
            document.getElementById('setting-bg-theme').value = saved.bgTheme;
        }

        function applyLanguage(lang) {
            const t = translations[lang] || translations['zh-TW'];
            document.getElementById('page-title').innerText = t.pageTitle;
            document.getElementById('search-input').placeholder = t.searchPlaceholder;
            document.getElementById('dd-title').innerText = t.hotTitle;
            document.getElementById('dd-clear').innerText = t.clearFilter;
            document.getElementById('hero-tag-text').innerText = t.heroTag;
            document.getElementById('hero-desc').innerText = t.heroDesc;
            document.getElementById('btn-play-now').innerText = t.btnPlay;
            document.getElementById('section-featured').innerText = t.sectionFeatured;
            document.getElementById('section-all-songs').innerText = t.sectionAllSongs;
            if(!isPlaying) {
                playerStatus.innerText = t.playerReady;
            }
            document.getElementById('settings-title').innerText = t.settingsTitle;
            document.getElementById('lbl-language').innerText = t.lblLang;
            document.getElementById('lbl-bgtheme').innerText = t.lblBgTheme;
            document.getElementById('btn-cancel').innerText = t.btnCancel;
            document.getElementById('btn-save').innerText = t.btnSave;
        }

        loadUserSettings();
        loadMusicData();

        function saveSettings() {
            const language = document.getElementById('setting-language').value;
            const bgTheme = document.getElementById('setting-bg-theme').value;

            localStorage.setItem('fr_music_settings', JSON.stringify({ language, bgTheme }));
            loadUserSettings();
            closeSettings();
        }

        function openSettings() { document.getElementById('settings-modal').classList.add('open'); }
        function closeSettings() { document.getElementById('settings-modal').classList.remove('open'); }

        function showHotSearch() { document.getElementById('search-dropdown').classList.add('show'); }
        function hideHotSearch() { setTimeout(() => { document.getElementById('search-dropdown').classList.remove('show'); }, 200); }
        function selectTag(tagName) {
            document.getElementById('search-input').value = tagName;
            filterSongs(tagName);
            document.getElementById('search-dropdown').classList.remove('show');
        }
        function resetSearchFilter() {
            document.getElementById('search-input').value = '';
            renderList(playlist);
        }

        function onLogoClick() {
            const logoImg = document.getElementById('logo-img');
            logoImg.classList.add('rotate-animate');
            setTimeout(() => { logoImg.classList.remove('rotate-animate'); }, 800);

            resetSearchFilter();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function setupHeroSection() {
            if (playlist.length === 0) return;
            let mostPlayedIndex = 0;
            let maxCount = -1;
            playlist.forEach((song, idx) => {
                const cnt = playCounts[song.url] || 0;
                if (cnt > maxCount) {
                    maxCount = cnt;
                    mostPlayedIndex = idx;
                }
            });

            heroSongIndex = mostPlayedIndex;
            const song = playlist[heroSongIndex];

            document.getElementById('hero-cover').src = song.cover;
            document.getElementById('hero-title').innerText = song.title;
            const savedLang = (JSON.parse(localStorage.getItem('fr_music_settings')) || {}).language || 'zh-TW';
            const t = translations[savedLang] || translations['zh-TW'];
            document.getElementById('hero-desc').innerText = song.desc || t.heroDesc;
        }

        function renderGrid(songsToRender) {
            const gridContainer = document.getElementById('grid-section-container');
            if (!gridContainer) return;
            gridContainer.innerHTML = '';
            
            songsToRender.slice(0, 4).forEach((song) => {
                const originalIndex = playlist.findIndex(s => s.url === song.url);
                gridContainer.innerHTML += `
                    <div class="album-card" onclick="openModal(); playSong(${originalIndex});">
                        <img src="${song.cover}" alt="${song.title}">
                        <div class="title">${song.title}</div>
                        <div class="desc">${song.desc}</div>
                    </div>
                `;
            });
        }

        function renderList(songsToRender = playlist) {
            const listContainer = document.getElementById('song-list-container');
            if (!listContainer) return;
            listContainer.innerHTML = '';
            
            const savedLang = (JSON.parse(localStorage.getItem('fr_music_settings')) || {}).language || 'zh-TW';
            const t = translations[savedLang] || translations['zh-TW'];

            if (songsToRender.length === 0) {
                listContainer.innerHTML = `<div style="text-align:center; color:var(--text-secondary); padding: 30px;">${t.notFound}</div>`;
                return;
            }
            
            songsToRender.forEach((song) => {
                const originalIndex = playlist.findIndex(s => s.url === song.url);
                listContainer.innerHTML += `
                    <div class="song-item">
                        <div class="song-info" onclick="openModal(); playSong(${originalIndex});">
                            <img src="${song.cover}" class="song-thumb" alt="封面">
                            <div>
                                <div class="song-title">${song.title}</div>
                                <div class="song-artist">${song.artist}</div>
                            </div>
                        </div>
                        <div class="song-actions-group">
                            <button class="action-btn" onclick="playSong(${originalIndex})">${t.btnPlayList}</button>
                        </div>
                    </div>
                `;
            });
        }

        function filterSongs(keyword) {
            const filtered = playlist.filter(s => s.title.toLowerCase().includes(keyword.toLowerCase()) || s.desc.toLowerCase().includes(keyword.toLowerCase()));
            renderList(filtered);
        }

        function playSong(index) {
            currentIndex = index;
            const song = playlist[currentIndex];
            if (!song) return;
            
            playCounts[song.url] = (playCounts[song.url] || 0) + 1;
            localStorage.setItem('fr_play_counts', JSON.stringify(playCounts));
            setupHeroSection();

            audio.src = song.url;
            audio.play();
            isPlaying = true;
            
            const savedLang = (JSON.parse(localStorage.getItem('fr_music_settings')) || {}).language || 'zh-TW';
            const t = translations[savedLang] || translations['zh-TW'];

            playerTitle.innerText = song.title;
            modalSongTitle.innerText = song.title;
            modalSongArtist.innerText = song.artist;
            playerThumb.src = song.cover;
            modalCover.src = song.cover;
            modalBlurBg.style.backgroundImage = `url('${song.cover}')`;
            playerStatus.innerText = t.playerPlaying;
            
            playIcon.innerHTML = pauseSvg;
            modalPlayIcon.innerHTML = pauseSvg;
        }

        function togglePlayPause() {
            const savedLang = (JSON.parse(localStorage.getItem('fr_music_settings')) || {}).language || 'zh-TW';
            const t = translations[savedLang] || translations['zh-TW'];

            if (!audio.src && playlist.length > 0) {
                playSong(0);
                return;
            }
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                playIcon.innerHTML = playSvg;
                modalPlayIcon.innerHTML = playSvg;
                playerStatus.innerText = t.playerPaused;
            } else {
                audio.play();
                isPlaying = true;
                playIcon.innerHTML = pauseSvg;
                modalPlayIcon.innerHTML = pauseSvg;
                playerStatus.innerText = t.playerPlaying;
            }
        }

        function nextSong() {
            if (isShuffle) {
                currentIndex = Math.floor(Math.random() * playlist.length);
            } else {
                currentIndex = (currentIndex + 1) % playlist.length;
            }
            playSong(currentIndex);
        }

        function prevSong() {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            playSong(currentIndex);
        }

        function skipTime(seconds) {
            if (!audio.duration) return;
            audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + seconds));
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            document.querySelectorAll('.shuffle-trigger').forEach(b => b.classList.toggle('active', isShuffle));
        }

        function toggleRepeat() {
            isRepeat = !isRepeat;
            document.querySelectorAll('.repeat-trigger').forEach(b => b.classList.toggle('active', isRepeat));
        }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration && !isDragging) {
                const percent = (audio.currentTime / audio.duration) * 100;
                updateProgressUI(percent);
                
                const formattedCurrent = formatTime(audio.currentTime);
                const formattedDuration = formatTime(audio.duration);
                
                currentTimeEl.innerText = formattedCurrent;
                durationTimeEl.innerText = formattedDuration;
                modalCurrentTimeEl.innerText = formattedCurrent;
                modalDurationTimeEl.innerText = formattedDuration;

                if (isPlaying) {
                    document.querySelectorAll('.v-bar').forEach(bar => {
                        const randomHeight = Math.floor(Math.random() * 28) + 8;
                        bar.style.height = randomHeight + 'px';
                    });
                }
            }
        });

        function updateProgressUI(percent) {
            progressFilled.style.width = percent + '%';
            modalProgressFilled.style.width = percent + '%';
        }

        let isDragging = false;
        function setupSeekBar(barId) {
            const bar = document.getElementById(barId);
            if(!bar) return;

            const getPercent = (e) => {
                const rect = bar.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                let percent = (clientX - rect.left) / rect.width;
                return Math.max(0, Math.min(1, percent));
            };

            const onStart = (e) => {
                if (!audio.duration) return;
                isDragging = true;
                const percent = getPercent(e);
                updateProgressUI(percent * 100);
            };

            const onMove = (e) => {
                if (!isDragging || !audio.duration) return;
                const percent = getPercent(e);
                updateProgressUI(percent * 100);
                currentTimeEl.innerText = formatTime(percent * audio.duration);
                modalCurrentTimeEl.innerText = formatTime(percent * audio.duration);
            };

            const onEnd = (e) => {
                if (!isDragging || !audio.duration) return;
                isDragging = false;
                const percent = getPercent(e.changedTouches ? e.changedTouches[0] : e);
                audio.currentTime = percent * audio.duration;
            };

            bar.addEventListener('mousedown', onStart);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);
            bar.addEventListener('touchstart', onStart);
            window.addEventListener('touchmove', onMove);
            window.addEventListener('touchend', onEnd);
        }

        setupSeekBar('progress-bar');
        setupSeekBar('modal-progress-bar');

        function setVolume(val) { audio.volume = val; }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return mins + ":" + (secs < 10 ? "0" : "") + secs;
        }

        audio.addEventListener('ended', () => {
            if (isRepeat) { audio.play(); } else { nextSong(); }
        });

        function openModal() { document.getElementById('now-playing-modal').classList.add('open'); }
        function closeModal() { document.getElementById('now-playing-modal').classList.remove('open'); }
    </script>
</body>
</html>
