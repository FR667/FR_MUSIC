<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FR MUSIC - 專業音樂平台</title>
    <style>
        :root { --bg: #121212; --nav: #000; --accent: #1DB954; --text: #fff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        
        /* 導覽列 */
        nav { background: var(--nav); padding: 10px 20px; display: flex; align-items: center; gap: 20px; border-bottom: 1px solid #333; }
        .logo-img { width: 50px; height: 50px; background: #333; border-radius: 4px; object-fit: cover; }
        .brand { font-size: 1.5rem; font-weight: bold; color: var(--accent); }

        /* 歌曲列表 */
        .container { padding: 40px; max-width: 800px; margin: auto; }
        .song-item { background: #181818; padding: 20px; margin: 10px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        
        /* 播放器 */
        .player-bar { position: fixed; bottom: 0; width: 100%; background: #282828; padding: 15px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .controls { display: flex; gap: 20px; align-items: center; }
        button { background: var(--accent); border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        
        footer { text-align: center; color: #777; margin-top: 50px; font-size: 0.8rem; }
    </style>
</head>
<body>

<nav>
    <img src="https://picsum.photos/50" class="logo-img" alt="Logo">
    <div class="brand">FR MUSIC</div>
</nav>

<div class="container">
    <h2>歌曲精選</h2>
    <!-- 音樂清單 -->
    <div class="song-item">
        <span>1. 我的第一首歌</span>
        <button onclick="playSong('https://res.cloudinary.com/mwnbak3n/video/upload/v1786887399/bbd819d1-0744-43ac-97af-365f544b6958.wav', '我的第一首歌')">播放</button>
    </div>
    <div class="song-item">
        <span>2. 我的第二首歌</span>
        <button onclick="playSong('https://res.cloudinary.com/mwnbak3n/video/upload/v1786887396/4662a3ad-d31c-440d-9d3c-32b500f93610.wav', '我的第二首歌')">播放</button>
    </div>
</div>

<div class="player-bar">
    <div id="now-playing">請選擇一首歌曲</div>
    <audio id="audio-player" controls></audio>
    <div class="controls">
        <button onclick="skip(-10)">後退 10s</button>
        <button onclick="skip(10)">快轉 10s</button>
    </div>
</div>

<footer>&copy; 2026 FR科技公司</footer>

<script>
    function playSong(url, title) {
        const player = document.getElementById('audio-player');
        document.getElementById('now-playing').innerText = "正在播放: " + title;
        player.src = url;
        player.play();
    }
    function skip(sec) {
        const player = document.getElementById('audio-player');
        player.currentTime += sec;
    }
</script>

</body>
</html>
