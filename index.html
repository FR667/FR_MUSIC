<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FR MUSIC - 專業音樂平台</title>
    <style>
        :root { 
            --bg-color: #000000; 
            --nav-color: rgba(18, 18, 18, 0.85); 
            --surface: #181818; 
            --surface-hover: #282828;
            --accent: #fa243c; 
            --text-main: #ffffff; 
            --text-secondary: #b3b3b3;
            --border-color: #282828;
        }
        
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding-bottom: 140px; }
        
        /* 頂部導覽列 */
        nav { background: var(--nav-color); padding: 16px 40px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(20px); }
        .logo-img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; }
        .brand { font-size: 1.35rem; font-weight: 700; letter-spacing: 0.5px; color: var(--text-main); }

        /* 主內容區 */
        .container { padding: 40px; max-width: 1000px; margin: auto; }
        h1 { font-size: 2rem; margin-bottom: 24px; font-weight: 700; }
        
        .song-list { display: flex; flex-direction: column; gap: 8px; }
        .song-item { background: var(--surface); padding: 12px 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s ease; border: 1px solid transparent; }
        .song-item:hover { background: var(--surface-hover); }
        
        .song-info { display: flex; align-items: center; gap: 18px; }
        .song-thumb { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; }
        .song-title { font-weight: 600; font-size: 1rem; color: var(--text-main); }
        .song-artist { font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px; }

        /* 播放按鈕 */
        .action-btn { background: transparent; border: 1px solid rgba(255, 255, 255, 0.3); color: var(--text-main); padding: 8px 22px; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: all 0.2s; }
        .action-btn:hover { border-color: var(--text-main); background: rgba(255, 255, 255, 0.1); }

        /* 底部專業播放控制列 (Sticky Player Bar) */
        .player-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #121212; border-top: 1px solid var(--border-color); padding: 16px 40px; display: grid; grid-template-columns: 1fr 2fr 1fr; align-items: center; gap: 20px; z-index: 1000; }
        
        .player-left { display: flex; align-items: center; gap: 15px; }
        .player-thumb { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; background: #222; }
        .player-meta .title { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
        .player-meta .status { font-size: 0.75rem; color: var(--text-secondary); margin-top: 4px; }

        /* 中間控制按鈕與進度條 */
        .player-center { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
        .player-controls { display: flex; align-items: center; gap: 24px; }
        
        /* 向量圖示按鈕 (完全不用 Emoji) */
        .ctrl-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: color 0.2s; padding: 4px; }
        .ctrl-btn:hover { color: var(--text-main); }
        .ctrl-btn svg { width: 20px; height: 20px; fill: currentColor; }
        
        .main-play-btn { background: var(--text-main); color: #000; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; transition: transform 0.1s; }
        .main-play-btn:hover { transform: scale(1.05); }
        .main-play-btn svg { width: 16px; height: 16px; fill: #000; }

        /* 進度條設計 */
        .progress-container { width: 100%; display: flex; align-items: center; gap: 12px; font-size: 0.75rem; color: var(--text-secondary); }
        .progress-bar { flex-grow: 1; height: 4px; background: #4d4d4d; border-radius: 2px; cursor: pointer; position: relative; transition: height 0.1s; }
        .progress-bar:hover { height: 6px; }
        .progress-filled { height: 100%; background: var(--text-main); width: 0%; border-radius: 2px; position: relative; }

        footer { text-align: center; color: var(--text-secondary); margin-top: 60px; font-size: 0.8rem; letter-spacing: 0.5px; }

        @media (max-width: 768px) {
            .player-bar { grid-template-columns: 1fr 1.5fr; padding: 12px 20px; }
            .player-left { display: none; }
        }
    </style>
</head>
<body>

<!-- 頂部導覽列 -->
<nav>
    <img src="https://i.ibb.co/m54LF470/Background-Eraser-20260816-214356376.png" class="logo-img" alt="FR MUSIC Logo">
    <div class="brand">FR MUSIC</div>
</nav>

<!-- 內容區：音樂清單 -->
<div class="container">
    <h1>熱門推薦</h1>
    <div class="song-list">
        
        <div class="song-item">
            <div class="song-info">
                <img src="https://i.ibb.co/VctJ2qpx/Background-Eraser-20260816-215827203.jpg" class="song-thumb" alt="封面">
                <div>
                    <div class="song-title">精選單曲 01</div>
                    <div class="song-artist">FR MUSIC · 官方發行</div>
                </div>
            </div>
            <button class="action-btn" onclick="playSong('https://res.cloudinary.com/mwnbak3n/video/upload/v1786887399/bbd819d1-0744-43ac-97af-365f544b6958.wav', '精選單曲 01')">播放</button>
        </div>

        <div class="song-item">
            <div class="song-info">
                <img src="https://i.ibb.co/VctJ2qpx/Background-Eraser-20260816-215827203.jpg" class="song-thumb" alt="封面">
                <div>
                    <div class="song-title">精選單曲 02</div>
                    <div class="song-artist">FR MUSIC · 官方發行</div>
                </div>
            </div>
            <button class="action-btn" onclick="playSong('https://res.cloudinary.com/mwnbak3n/video/upload/v1786887396/4662a3ad-d31c-440d-9d3c-32b500f93610.wav', '精選單曲 02')">播放</button>
        </div>

        <div class="song-item">
            <div class="song-info">
                <img src="https://i.ibb.co/VctJ2qpx/Background-Eraser-20260816-215827203.jpg" class="song-thumb" alt="封面">
                <div>
                    <div class="song-title">精選單曲 03</div>
                    <div class="song-artist">FR MUSIC · 官方發行</div>
                </div>
            </div>
            <button class="action-btn" onclick="playSong('https://res.cloudinary.com/mwnbak3n/video/upload/v1786887395/dad5a630-9abb-48a5-8007-bf96e4984d1c.wav', '精選單曲 03')">播放</button>
        </div>

    </div>
</div>

<!-- 底部專業播放器 -->
<div class="player-bar">
    <div class="player-left">
        <img id="player-thumb" src="https://i.ibb.co/VctJ2qpx/Background-Eraser-20260816-215827203.jpg" class="player-thumb" alt="Cover">
        <div class="player-meta">
            <div id="player-title" class="title">尚未選擇歌曲</div>
            <div id="player-status" class="status">FR MUSIC 準備就緒</div>
        </div>
    </div>

    <div class="player-center">
        <div class="player-controls">
            <!-- 倒轉 10 秒 SVG 圖示 -->
            <button class="ctrl-btn" onclick="skip(-10)" title="倒轉 10 秒">
                <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
                <span style="font-size: 10px; margin-left: 2px; font-weight: bold;">-10</span>
            </button>

            <!-- 播放/暫停 SVG 圖示 -->
            <button id="play-pause-btn" class="main-play-btn" onclick="togglePlayPause()">
                <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>

            <!-- 快轉 10 秒 SVG 圖示 -->
            <button class="ctrl-btn" onclick="skip(10)" title="快轉 10 秒">
                <span style="font-size: 10px; margin-right: 2px; font-weight: bold;">+10</span>
                <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6-8.5-6z"/></svg>
            </button>
        </div>

        <div class="progress-container">
            <span id="current-time">0:00</span>
            <div class="progress-bar" id="progress-container" onclick="setProgress(event)">
                <div class="progress-filled" id="progress-filled"></div>
            </div>
            <span id="duration-time">0:00</span>
        </div>
    </div>
    
    <div></div>
</div>

<audio id="audio-player"></audio>

<footer>&copy; 2026 FR科技公司 版權所有</footer>

<script>
    const audio = document.getElementById('audio-player');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const playIcon = document.getElementById('play-icon');
    const playerTitle = document.getElementById('player-title');
    const playerStatus = document.getElementById('player-status');
    const progressFilled = document.getElementById('progress-filled');
    const currentTimeEl = document.getElementById('current-time');
    const durationTimeEl = document.getElementById('duration-time');
    const progressContainer = document.getElementById('progress-container');

    const albumCover = "https://i.ibb.co/VctJ2qpx/Background-Eraser-20260816-215827203.jpg";
    let isPlaying = false;

    const playSvg = '<path d="M8 5v14l11-7z"/>';
    const pauseSvg = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

    function playSong(url, title) {
        audio.src = url;
        audio.play();
        isPlaying = true;
        
        playerTitle.innerText = title;
        playerStatus.innerText = "FR MUSIC 播放中";
        playIcon.innerHTML = pauseSvg;
    }

    function togglePlayPause() {
        if (!audio.src) return;
        if (isPlaying) {
            audio.pause();
            isPlaying = false;
            playIcon.innerHTML = playSvg;
            playerStatus.innerText = "已暫停";
        } else {
            audio.play();
            isPlaying = true;
            playIcon.innerHTML = pauseSvg;
            playerStatus.innerText = "FR MUSIC 播放中";
        }
    }

    function skip(sec) {
        if (!audio.src) return;
        audio.currentTime += sec;
    }

    audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFilled.style.width = percent + '%';
            currentTimeEl.innerText = formatTime(audio.currentTime);
            durationTimeEl.innerText = formatTime(audio.duration);
        }
    });

    function setProgress(e) {
        if (!audio.duration) return;
        const width = progressContainer.clientWidth;
        const clickX = e.offsetX;
        audio.currentTime = (clickX / width) * audio.duration;
    }

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return mins + ":" + (secs < 10 ? "0" : "") + secs;
    }

    audio.addEventListener('ended', () => {
        isPlaying = false;
        playIcon.innerHTML = playSvg;
        playerStatus.innerText = "播放結束";
    });
</script>

</body>
</html>
