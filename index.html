<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FR MUSIC - 音訊平台</title>
    <style>
        :root { 
            --bg-color: #0f0f0f; 
            --nav-color: #1a1a1a; 
            --surface: #212121; 
            --surface-hover: #2a2a2a;
            --accent: #fa243c; /* Apple Music 風格紅 / 可自行改為 YouTube 紅 #ff0000 */
            --text-main: #ffffff; 
            --text-secondary: #aaaaaa;
        }
        
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding-bottom: 120px; }
        
        /* 頂部導覽列 */
        nav { background: var(--nav-color); padding: 12px 30px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .logo-img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
        .brand { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.5px; color: var(--text-main); }
        .brand span { color: var(--accent); }

        /* 主內容區 */
        .container { padding: 40px 30px; max-width: 900px; margin: auto; }
        h2 { font-size: 1.8rem; margin-bottom: 20px; font-weight: 600; }
        
        .song-list { display: flex; flex-direction: column; gap: 12px; }
        .song-item { background: var(--surface); padding: 16px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; border: 1px solid transparent; }
        .song-item:hover { background: var(--surface-hover); border-color: #333; }
        
        .song-info { display: flex; align-items: center; gap: 15px; }
        .song-thumb { width: 45px; height: 45px; background: #333; border-radius: 6px; object-fit: cover; }
        .song-title { font-weight: 600; font-size: 1rem; }
        .song-artist { font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px; }

        /* 播放按鈕 */
        .play-btn { background: transparent; border: 2px solid var(--text-main); color: var(--text-main); padding: 8px 18px; border-radius: 20px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
        .play-btn:hover { background: var(--text-main); color: #000; }

        /* 底部專業播放控制列 (Sticky Player Bar) */
        .player-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(26, 26, 26, 0.95); backdrop-filter: blur(20px); border-top: 1px solid #333; padding: 15px 30px; display: grid; grid-template-columns: 1fr 2fr 1fr; align-items: center; gap: 20px; z-index: 1000; }
        
        .player-left { display: flex; align-items: center; gap: 12px; }
        .player-thumb { width: 50px; height: 50px; background: #333; border-radius: 6px; object-fit: cover; }
        .player-meta .title { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
        .player-meta .status { font-size: 0.75rem; color: var(--accent); margin-top: 2px; }

        /* 中間控制按鈕與進度條 */
        .player-center { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
        .player-controls { display: flex; align-items: center; gap: 20px; }
        .ctrl-btn { background: none; border: none; color: var(--text-main); font-size: 1.1rem; cursor: pointer; transition: color 0.2s; }
        .ctrl-btn:hover { color: var(--accent); }
        .main-play-btn { background: var(--text-main); color: #000; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; border: none; cursor: pointer; }

        /* 進度條設計 */
        .progress-container { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 0.75rem; color: var(--text-secondary); }
        .progress-bar { flex-grow: 1; height: 5px; background: #444; border-radius: 3px; cursor: pointer; position: relative; overflow: hidden; }
        .progress-filled { height: 100%; background: var(--text-main); width: 0%; transition: width 0.1s linear; }

        footer { text-align: center; color: var(--text-secondary); margin-top: 60px; font-size: 0.8rem; }

        /* 響應式調整 */
        @media (max-width: 768px) {
            .player-bar { grid-template-columns: 1fr 1.5fr; padding: 12px; }
            .player-left { display: none; }
        }
    </style>
</head>
<body>

<!-- 頂部導覽列 -->
<nav>
    <img src="https://picsum.photos/100" class="logo-img" alt="Logo">
    <div class="brand">FR <span>MUSIC</span></div>
</nav>

<!-- 內容區：音樂清單 -->
<div class="container">
    <h2>立即聆聽</h2>
    <div class="song-list">
        
        <div class="song-item">
            <div class="song-info">
                <img src="https://picsum.photos/seed/song1/100" class="song-thumb" alt="cover">
                <div>
                    <div class="song-title">我的第一首歌</div>
                    <div class="song-artist">FR 藝術家</div>
                </div>
            </div>
            <button class="play-btn" onclick="playSong('https://res.cloudinary.com/mwnbak3n/video/upload/v1786887399/bbd819d1-0744-43ac-97af-365f544b6958.wav', '我的第一首歌', 'FR 藝術家', 'https://picsum.photos/seed/song1/100')">播放</button>
        </div>

        <div class="song-item">
            <div class="song-info">
                <img src="https://picsum.photos/seed/song2/100" class="song-thumb" alt="cover">
                <div>
                    <div class="song-title">我的第二首歌</div>
                    <div class="song-artist">FR 藝術家</div>
                </div>
            </div>
            <button class="play-btn" onclick="playSong('https://res.cloudinary.com/mwnbak3n/video/upload/v1786887396/4662a3ad-d31c-440d-9d3c-32b500f93610.wav', '我的第二首歌', 'FR 藝術家', 'https://picsum.photos/seed/song2/100')">播放</button>
        </div>

        <div class="song-item">
            <div class="song-info">
                <img src="https://picsum.photos/seed/song3/100" class="song-thumb" alt="cover">
                <div>
                    <div class="song-title">我的第三首歌</div>
                    <div class="song-artist">FR 藝術家</div>
                </div>
            </div>
            <button class="play-btn" onclick="playSong('https://res.cloudinary.com/mwnbak3n/video/upload/v1786887395/dad5a630-9abb-48a5-8007-bf96e4984d1c.wav', '我的第三首歌', 'FR 藝術家', 'https://picsum.photos/seed/song3/100')">播放</button>
        </div>

    </div>
</div>

<!-- 底部專業播放器 -->
<div class="player-bar">
    <div class="player-left">
        <img id="player-thumb" src="https://picsum.photos/100" class="player-thumb" alt="Cover">
        <div class="player-meta">
            <div id="player-title" class="title">尚未選擇歌曲</div>
            <div id="player-status" class="status">就緒</div>
        </div>
    </div>

    <div class="player-center">
        <div class="player-controls">
            <button class="ctrl-btn" onclick="skip(-10)" title="倒轉 10 秒">⏪ 10s</button>
            <button id="play-pause-btn" class="main-play-btn" onclick="togglePlayPause()">▶</button>
            <button class="ctrl-btn" onclick="skip(10)" title="快轉 10 秒">10s ⏩</button>
        </div>
        <div class="progress-container">
            <span id="current-time">0:00</span>
            <div class="progress-bar" id="progress-container" onclick="setProgress(event)">
                <div class="progress-filled" id="progress-filled"></div>
            </div>
            <span id="duration-time">0:00</span>
        </div>
    </div>
    
    <div></div> <!-- 佔位平衡排版 -->
</div>

<!-- 隱藏的 HTML5 Audio 物件 -->
<audio id="audio-player"></audio>

<footer>&copy; 2026 FR科技公司 版權所有</footer>

<script>
    const audio = document.getElementById('audio-player');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const playerTitle = document.getElementById('player-title');
    const playerStatus = document.getElementById('player-status');
    const playerThumb = document.getElementById('player-thumb');
    const progressFilled = document.getElementById('progress-filled');
    const currentTimeEl = document.getElementById('current-time');
    const durationTimeEl = document.getElementById('duration-time');
    const progressContainer = document.getElementById('progress-container');

    let isPlaying = false;

    // 播放指定歌曲
    function playSong(url, title, artist, thumbUrl) {
        audio.src = url;
        audio.play();
        isPlaying = true;
        
        // 更新底部播放器資訊
        playerTitle.innerText = title + " - " + artist;
        playerStatus.innerText = "正在播放";
        playerThumb.src = thumbUrl;
        playPauseBtn.innerText = "⏸";
    }

    // 播放/暫停切換
    function togglePlayPause() {
        if (!audio.src) return;
        if (isPlaying) {
            audio.pause();
            isPlaying = false;
            playPauseBtn.innerText = "▶";
            playerStatus.innerText = "已暫停";
        } else {
            audio.play();
            isPlaying = true;
            playPauseBtn.innerText = "⏸";
            playerStatus.innerText = "正在播放";
        }
    }

    // 快轉 / 倒轉
    function skip(sec) {
        if (!audio.src) return;
        audio.currentTime += sec;
    }

    // 更新進度條與時間
    audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFilled.style.width = percent + '%';
            
            currentTimeEl.innerText = formatTime(audio.currentTime);
            durationTimeEl.innerText = formatTime(audio.duration);
        }
    });

    // 點擊進度條跳轉播放
    function setProgress(e) {
        if (!audio.duration) return;
        const width = progressContainer.clientWidth;
        const clickX = e.offsetX;
        audio.currentTime = (clickX / width) * audio.duration;
    }

    // 時間格式化 (秒數轉 mm:ss)
    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return mins + ":" + (secs < 10 ? "0" : "") + secs;
    }

    audio.addEventListener('ended', () => {
        isPlaying = false;
        playPauseBtn.innerText = "▶";
        playerStatus.innerText = "播放完畢";
    });
</script>

</body>
</html>
