<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FR MUSIC - 專業音樂平台</title>
    <style>
        :root { 
            --bg-color: #000000; 
            --nav-color: rgba(18, 18, 18, 0.85); 
            --surface: #181818; 
            --surface-hover: #282828;
            --accent: #fa243c; 
            --text-main: #ffffff; 
            --text-secondary: #888888;
            --border-color: #282828;
        }
        
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding-bottom: 140px; }
        
        /* 頂部導覽列 */
        nav { background: var(--nav-color); padding: 16px 40px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(20px); }
        .logo-img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; }
        .brand { font-size: 1.35rem; font-weight: 700; letter-spacing: 0.5px; color: var(--text-main); }

        /* 主內容區 */
        .container { padding: 40px; max-width: 1000px; margin: auto; }
        h1 { font-size: 2rem; margin-bottom: 24px; font-weight: 700; }
        
        .song-list { display: flex; flex-direction: column; gap: 8px; }
        .song-item { background: var(--surface); padding: 12px 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s ease; border: 1px solid transparent; }
        .song-item:hover { background: var(--surface-hover); }
        
        .song-info { display: flex; align-items: center; gap: 18px; }
        .song-thumb { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; }
        .song-title { font-weight: 600; font-size: 1rem; color: var(--text-main); }
        .song-artist { font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px; }

        /* 播放按鈕 */
        .action-btn { background: transparent; border: 1px solid rgba(255, 255, 255, 0.3); color: var(--text-main); padding: 8px 22px; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: all 0.2s; }
        .action-btn:hover { border-color: var(--text-main); background: rgba(255, 255, 255, 0.1); }

        /* 底部播放控制列 (Sticky Player Bar) */
        .player-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #121212; border-top: 1px solid var(--border-color); padding: 14px 40px; display: grid; grid-template-columns: 1fr 2fr 1fr; align-items: center; gap: 20px; z-index: 1000; }
        
        .player-left { display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .player-thumb { width: 52px; height: 52px; border-radius: 6px; object-fit: cover; background: #222; }
        .player-meta .title { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
        .player-meta .status { font-size: 0.75rem; color: var(--text-secondary); margin-top: 4px; }

        /* 中間控制區 */
        .player-center { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
        .player-controls { display: flex; align-items: center; gap: 24px; }
        
        .ctrl-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: color 0.2s; padding: 4px; }
        .ctrl-btn:hover { color: var(--text-main); }
        .ctrl-btn.active { color: var(--accent); }
        .ctrl-btn svg { width: 20px; height: 20px; fill: currentColor; }
        
        .main-play-btn { background: var(--text-main); color: #000; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; transition: transform 0.1s; }
        .main-play-btn:hover { transform: scale(1.05); }
        .main-play-btn svg { width: 16px; height: 16px; fill: #000; }

        /* 進度條 */
        .progress-container { width: 100%; display: flex; align-items: center; gap: 12px; font-size: 0.75rem; color: var(--text-secondary); }
        .progress-bar { flex-grow: 1; height: 4px; background: #4d4d4d; border-radius: 2px; cursor: pointer; position: relative; transition: height 0.1s; }
        .progress-bar:hover { height: 6px; }
        .progress-filled { height: 100%; background: var(--text-main); width: 0%; border-radius: 2px; }

        /* 右側音量控制 */
        .player-right { display: flex; align-items: center; justify-content: flex-end; gap: 10px; color: var(--text-secondary); }
        .volume-slider { width: 90px; accent-color: var(--text-main); cursor: pointer; }

        /* ==================== 蘋果風格全螢幕播放大視窗 (Now Playing Modal) ==================== */
        .now-playing-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1f1f1f 0%, #0a0a0a 100%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 60px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform: translateY(100%);
        }
        .now-playing-modal.open {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        /* 彈窗頂部收起鈕 */
        .modal-header { display: flex; justify-content: center; align-items: center; position: relative; }
        .collapse-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 10px; transition: color 0.2s; }
        .collapse-btn:hover { color: var(--text-main); }
        .collapse-btn svg { width: 28px; height: 28px; fill: currentColor; }

        /* 彈窗主內容：支援橫向左右配置與直向置中 */
        .modal-body {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 60px;
            max-width: 900px;
            margin: auto;
            width: 100%;
        }
        .modal-cover {
            width: 320px;
            height: 320px;
            border-radius: 16px;
            object-fit: cover;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .modal-info-panel {
            display: flex;
            flex-direction: column;
            width: 400px;
            gap: 20px;
        }
        .modal-song-title { font-size: 1.8rem; font-weight: 700; color: var(--text-main); }
        .modal-song-artist { font-size: 1rem; color: var(--text-secondary); }

        .modal-controls-area { display: flex; flex-direction: column; gap: 16px; }
        .modal-main-controls { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 10px; }
        .modal-main-controls .ctrl-btn svg { width: 26px; height: 26px; }
        .modal-play-btn { background: var(--text-main); color: #000; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; transition: transform 0.1s; }
        .modal-play-btn:hover { transform: scale(1.05); }
        .modal-play-btn svg { width: 24px; height: 24px; fill: #000; }

        footer { text-align: center; color: var(--text-secondary); margin-top: 60px; font-size: 0.8rem; letter-spacing: 0.5px; }

        @media (max-width: 768px) {
            .modal-body { flex-direction: column; gap: 25px; }
            .modal-cover { width: 220px; height: 220px; }
            .modal-info-panel { width: 100%; text-align: center; }
            .now-playing-modal { padding: 20px; }
            .player-bar { grid-template-columns: 1fr 1.5fr; padding: 12px 20px; }
            .player-right { display: none; }
        }
    </style>
</head>
<body>

<!-- 頂部導覽列 -->
<nav>
    <img src="https://i.ibb.co/m54LF470/Background-Eraser-20260816-214356376.png" class="logo-img" alt="FR MUSIC Logo">
    <div class="brand">FR MUSIC</div>
</nav>

<!-- 內容區：音樂清單 -->
<div class="container">
    <h1>熱門推薦</h1>
    <div class="song-list" id="song-list-container">
        <!-- 動態產生列表 -->
    </div>
</div>

<!-- 底部播放控制列 -->
<div class="player-bar">
    <div class="player-left" onclick="openModal()" title="點擊展開播放大視窗">
        <img id="player-thumb" src="https://i.ibb.co/VctJ2qpx/Background-Eraser-20260816-215827203.jpg" class="player-thumb" alt="Cover">
        <div class="player-meta">
            <div id="player-title" class="title">尚未選擇歌曲</div>
            <div id="player-status" class="status">FR MUSIC 準備就緒</div>
        </div>
    </div>

    <div class="player-center">
        <div class="player-controls">
            <!-- 隨機播放按鈕 -->
            <button id="shuffle-btn" class="ctrl-btn" onclick="toggleShuffle()" title="隨機播放">
                <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
            </button>
            <!-- 上一首 -->
            <button class="ctrl-btn" onclick="prevSong()" title="上一首">
                <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <!-- 播放/暫停 -->
            <button id="play-pause-btn" class="main-play-btn" onclick="togglePlayPause()">
                <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <!-- 下一首 -->
            <button class="ctrl-btn" onclick="nextSong()" title="下一首">
                <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
            <!-- 循環播放按鈕 -->
            <button id="repeat-btn" class="ctrl-btn" onclick="toggleRepeat()" title="循環播放">
                <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
            </button>
        </div>

        <div class="progress-container">
            <span id="current-time">0:00</span>
            <div class="progress-bar" id="progress-container" onclick="setProgress(event)">
                <div class="progress-filled" id="progress-filled"></div>
            </div>
            <span id="duration-time">0:00</span>
        </div>
    </div>
    
    <div class="player-right">
        <!-- 音量圖示與滑桿 -->
        <svg style="width:18px;height:18px;fill:currentColor;" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <input type="range" class="volume-slider" min="0" max="1" step="0.01" value="1" oninput="setVolume(this.value)">
    </div>
</div>

<!-- ==================== 蘋果風格全螢幕播放大視窗 ==================== -->
<div class="now-playing-modal" id="now-playing-modal">
    <div class="modal-header">
        <button class="collapse-btn" onclick="closeModal()" title="收起播放畫面">
            <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
        </button>
    </div>
    
    <div class="modal-body">
        <img src="https://i.ibb.co/VctJ2qpx/Background-Eraser-20260816-215827203.jpg" class="modal-cover" alt="Album Cover">
        
        <div class="modal-info-panel">
            <div>
                <div id="modal-song-title" class="modal-song-title">尚未選擇歌曲</div>
                <div class="modal-song-artist">FR MUSIC · 官方發行</div>
            </div>

            <div class="modal-controls-area">
                <div class="progress-container">
                    <span id="modal-current-time">0:00</span>
                    <div class="progress-bar" id="modal-progress-container" onclick="setProgress(event)">
                        <div class="progress-filled" id="modal-progress-filled"></div>
                    </div>
                    <span id="modal-duration-time">0:00</span>
                </div>

                <div class="modal-main-controls">
                    <button class="ctrl-btn" onclick="toggleShuffle()"><svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
                    <button class="ctrl-btn" onclick="prevSong()"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                    <button class="modal-play-btn" onclick="togglePlayPause()"><svg id="modal-play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
                    <button class="ctrl-btn" onclick="nextSong()"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
                    <button class="ctrl-btn" onclick="toggleRepeat()"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
                </div>
            </div>
        </div>
    </div>
    
    <footer>&copy; 2026 FR科技公司 版權所有</footer>
</div>

<audio id="audio-player"></audio>

<script>
    // 歌曲清單資料庫 (日後要新增音樂直接在這裡加即可！)
    const playlist = [
        { title: "FR精選單曲 01", url: "https://res.cloudinary.com/mwnbak3n/video/upload/v1786887399/bbd819d1-0744-43ac-97af-365f544b6958.wav" },
        { title: "FR精選單曲 02", url: "https://res.cloudinary.com/mwnbak3n/video/upload/v1786887396/4662a3ad-d31c-440d-9d3c-32b500f93610.wav" },
        { title: "FR精選單曲 03", url: "https://res.cloudinary.com/mwnbak3n/video/upload/v1786887395/dad5a630-9abb-48a5-8007-bf96e4984d1c.wav" }
    ];

    let currentIndex = 0;
    let isPlaying = false;
    let isShuffle = false;
    let isRepeat = false; // false: 不循環, true: 循環

    const audio = document.getElementById('audio-player');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const playIcon = document.getElementById('play-icon');
    const modalPlayIcon = document.getElementById('modal-play-icon');
    const playerTitle = document.getElementById('player-title');
    const modalSongTitle = document.getElementById('modal-song-title');
    const playerStatus = document.getElementById('player-status');
    const progressFilled = document.getElementById('progress-filled');
    const modalProgressFilled = document.getElementById('modal-progress-filled');
    const currentTimeEl = document.getElementById('current-time');
    const durationTimeEl = document.getElementById('duration-time');
    const modalCurrentTimeEl = document.getElementById('modal-current-time');
    const modalDurationTimeEl = document.getElementById('modal-duration-time');
    const progressContainer = document.getElementById('progress-container');

    const playSvg = '<path d="M8 5v14l11-7z"/>';
    const pauseSvg = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

    // 初始化渲染列表
    function renderList() {
        const listContainer = document.getElementById('song-list-container');
        listContainer.innerHTML = '';
        playlist.forEach((song, index) => {
            listContainer.innerHTML += `
                <div class="song-item">
                    <div class="song-info">
                        <img src="https://i.ibb.co/VctJ2qpx/Background-Eraser-20260816-215827203.jpg" class="song-thumb" alt="封面">
                        <div>
                            <div class="song-title">${song.title}</div>
                            <div class="song-artist">FR MUSIC · 官方發行</div>
                        </div>
                    </div>
                    <button class="action-btn" onclick="playSong(${index})">播放</button>
                </div>
            `;
        });
    }
    renderList();

    function playSong(index) {
        currentIndex = index;
        const song = playlist[currentIndex];
        audio.src = song.url;
        audio.play();
        isPlaying = true;
        
        playerTitle.innerText = song.title;
        modalSongTitle.innerText = song.title;
        playerStatus.innerText = "FR MUSIC 播放中";
        playIcon.innerHTML = pauseSvg;
        modalPlayIcon.innerHTML = pauseSvg;
    }

    function togglePlayPause() {
        if (!audio.src) {
            playSong(0);
            return;
        }
        if (isPlaying) {
            audio.pause();
            isPlaying = false;
            playIcon.innerHTML = playSvg;
            modalPlayIcon.innerHTML = playSvg;
            playerStatus.innerText = "已暫停";
        } else {
            audio.play();
            isPlaying = true;
            playIcon.innerHTML = pauseSvg;
            modalPlayIcon.innerHTML = pauseSvg;
            playerStatus.innerText = "FR MUSIC 播放中";
        }
    }

    function nextSong() {
        if (isShuffle) {
            currentIndex = Math.floor(Math.random() * playlist.length);
        } else {
            currentIndex = (currentIndex + 1) % playlist.length;
        }
        playSong(currentIndex);
    }

    function prevSong() {
        currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
        playSong(currentIndex);
    }

    function toggleShuffle() {
        isShuffle = !isShuffle;
        const btn = document.getElementById('shuffle-btn');
        if (isShuffle) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    }

    function toggleRepeat() {
        isRepeat = !isRepeat;
        const btn = document.getElementById('repeat-btn');
        if (isRepeat) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    }

    // 進度更新
    audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFilled.style.width = percent + '%';
            modalProgressFilled.style.width = percent + '%';
            
            const formattedCurrent = formatTime(audio.currentTime);
            const formattedDuration = formatTime(audio.duration);
            
            currentTimeEl.innerText = formattedCurrent;
            durationTimeEl.innerText = formattedDuration;
            modalCurrentTimeEl.innerText = formattedCurrent;
            modalDurationTimeEl.innerText = formattedDuration;
        }
    });

    function setProgress(e) {
        if (!audio.duration) return;
        const width = progressContainer.clientWidth;
        const clickX = e.offsetX;
        audio.currentTime = (clickX / width) * audio.duration;
    }

    function setVolume(val) {
        audio.volume = val;
    }

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return mins + ":" + (secs < 10 ? "0" : "") + secs;
    }

    // 歌曲結束時的處理
    audio.addEventListener('ended', () => {
        if (isRepeat) {
            audio.play();
        } else {
            nextSong();
        }
    });

    // 彈窗控制
    function openModal() {
        document.getElementById('now-playing-modal').classList.add('open');
    }
    function closeModal() {
        document.getElementById('now-playing-modal').classList.remove('now-playing-modal.open'); // 修正 class 移除
        document.getElementById('now-playing-modal').classList.remove('open');
    }
</script>

</body>
</html>
